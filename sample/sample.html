<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Leaflet + OSRM Route with Icons & Waypoints</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Leaflet CSS & JS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      const map = L.map('map').setView([52.517037, 13.38886], 13);

      // Add OpenStreetMap tiles
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors',
      }).addTo(map);

      // Coordinates
      const startCoord = [52.517037, 13.38886]; // lat, lng
      const midCoord = [52.50665764553073, 13.358929472566786]; // lat, lng
      const destCoord = [52.529407, 13.397634]; // lat, lng

      // Custom Icons
      const startIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      });

      const destIcon = L.icon({
        iconUrl: 'https://cdn-icons-png.flaticon.com/512/252/252025.png',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32],
      });

      // Add Start, Mid and Destination markers
      L.marker(startCoord, { icon: startIcon }).addTo(map).bindPopup('Start');
      L.marker(midCoord).addTo(map).bindPopup('Middle Waypoint');
      L.marker(destCoord, { icon: destIcon }).addTo(map).bindPopup('Destination');

      // OSRM coordinates (lng,lat order)
      const coords = `${startCoord[1]},${startCoord[0]};${midCoord[1]},${midCoord[0]};${destCoord[1]},${destCoord[0]}`;
      const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`;

      fetch(url)
        .then((res) => res.json())
        .then((data) => {
          const routeGeoJSON = data.routes[0].geometry;

          // Draw route
          const routeLayer = L.geoJSON(routeGeoJSON, {
            style: {
              color: 'blue',
              weight: 5,
              opacity: 0.8,
            },
          }).addTo(map);

        //   // Add intermediate markers (except first and last)
        //   const coordsArray = routeGeoJSON.coordinates;
        //   for (let i = 1; i < coordsArray.length - 1; i++) {
        //     const [lng, lat] = coordsArray[i];
        //     L.circleMarker([lat, lng], {
        //       radius: 2,
        //       color: 'red',
        //       fillOpacity: 0.8,
        //     }).addTo(map);
        //   }

          map.fitBounds(routeLayer.getBounds());
        })
        .catch((err) => {
          console.error('Error fetching route from OSRM:', err);
          alert('Failed to load route.');
        });
    </script>
  </body>
</html>
